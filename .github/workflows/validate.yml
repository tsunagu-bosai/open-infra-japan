name: Validate normalized data

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate normalized public toilet data
        run: |
          python tools/validate_public_toilet.py --input normalized

      - name: Rebuild combined export
        run: |
          python tools/export/export_facilities.py

      - name: Check generated export is committed
        run: |
          git diff --exit-code -- dist/facilities-official.csv
